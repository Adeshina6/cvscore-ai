<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — CVScore AI</title>
<meta name="description" content="This page doesn't exist, but your ATS score does. Head back to CVScore AI and scan your resume for free.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
.err-page {
  min-height: calc(100vh - 60px);
  display: flex; align-items: center; justify-content: center;
  padding: 4rem 2rem; flex-direction: column; text-align: center;
}
.err-code {
  font-size: clamp(5rem, 14vw, 9rem);
  font-weight: 700; font-family: var(--mono);
  letter-spacing: -.06em; line-height: 1;
  color: var(--border-strong);
  position: relative; margin-bottom: 1.5rem;
  user-select: none;
}
.err-code::after {
  content: 'PAGE NOT FOUND';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(.55rem, 1.6vw, .9rem);
  font-weight: 700; letter-spacing: .22em;
  color: var(--text-3);
  top: auto; bottom: -2rem;
  height: auto;
}
.err-body {
  max-width: 460px; margin: 3rem auto 0;
}
.err-body h1 {
  font-size: 1.5rem; font-weight: 700;
  letter-spacing: -.025em; margin-bottom: .75rem;
}
.err-body p {
  font-size: .95rem; color: var(--text-2);
  line-height: 1.7; margin-bottom: 2rem;
}
.err-links {
  display: flex; flex-direction: column; gap: .6rem;
  max-width: 300px; margin: 0 auto 2.5rem;
}
.err-link {
  display: flex; align-items: center; gap: .75rem;
  padding: .85rem 1.1rem; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  text-decoration: none; color: var(--text-1);
  transition: all .15s; font-size: .88rem; font-weight: 500;
}
.err-link:hover { border-color: var(--accent-border); background: var(--accent-tint); color: var(--accent); }
.err-link-icon { font-size: 1rem; flex-shrink: 0; }
.err-link-arrow { margin-left: auto; opacity: .5; font-size: .8rem; }

/* Animated resume illustration */
.resume-ghost {
  width: 180px; margin: 0 auto 2rem;
  opacity: .15; animation: float 3.5s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.resume-ghost-lines { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.rg-line { height: 8px; border-radius: 4px; background: var(--border-strong); }
.rg-line.short { width: 55%; }
.rg-line.med   { width: 75%; }
.rg-line.long  { width: 92%; }
.rg-spacer { height: 14px; }
</style>
</head>
<body>

<nav class="nav" id="mainNav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand"><span class="brand-mark"></span>CVScore AI</a>
    <div class="nav-links">
      <a href="index.html#features">Features</a>
      <a href="faq.html">FAQ</a>
    </div>
    <div class="nav-end">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="index.html#upload" class="btn btn-primary btn-sm">Scan my CV</a>
    </div>
  </div>
</nav>

<main class="err-page">
  <div class="err-code">404</div>
  <div class="resume-ghost">
    <div class="resume-ghost-lines">
      <div class="rg-line short"></div>
      <div class="rg-spacer"></div>
      <div class="rg-line long"></div>
      <div class="rg-line med"></div>
      <div class="rg-line long"></div>
      <div class="rg-spacer"></div>
      <div class="rg-line med"></div>
      <div class="rg-line long"></div>
      <div class="rg-line short"></div>
    </div>
  </div>
  <div class="err-body">
    <h1>This page got filtered by the ATS</h1>
    <p>The page you're looking for doesn't exist — much like how a badly formatted resume disappears into the void. Let's get you somewhere useful.</p>
    <div class="err-links">
      <a href="index.html#upload" class="err-link">
        <span class="err-link-icon">📄</span>
        Scan my resume
        <span class="err-link-arrow">→</span>
      </a>
      <a href="index.html" class="err-link">
        <span class="err-link-icon">🏠</span>
        Go to homepage
        <span class="err-link-arrow">→</span>
      </a>
      <a href="faq.html" class="err-link">
        <span class="err-link-icon">❓</span>
        Browse FAQs
        <span class="err-link-arrow">→</span>
      </a>
    </div>
  </div>
</main>

<script src="/shared.js"></script>
</body>
</html>
